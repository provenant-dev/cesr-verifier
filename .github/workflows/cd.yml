name: Publish & Deploy
run-name: "${{ inputs.AWS_ENV || 'DEV' }}: ${{ github.event.pull_request.title || github.ref }} ${{ inputs.UUID }}"

on:
  pull_request:
    types: [ closed ]
    branches: [ dev ]

  workflow_dispatch:
    inputs:
      REPO_REF:
        required: false
        type: string
        description: "Branch or tag to build"
        default: "dev"
      AWS_ENV:
        required: true
        default: DEV
        type: string
        description: Environment to Deploy
      UUID:
        required: false
        type: string
        description: UUID of workflow

jobs:
  # Skips the whole chain when a deploy freeze is active, before any image is built.
  preflight:
    if: |
      (contains(github.event.pull_request.title, '[no-deploy]') == false && github.event.pull_request.merged == true) ||
      inputs.UUID ||
      github.event_name == 'workflow_dispatch'
    uses: provenant-dev/github-action-helper/.github/workflows/preflight-deploy.yml@main
    secrets: inherit
    with:
      DEPLOY_ENV: ${{ inputs.AWS_ENV || 'DEV' }}

  publish:
    needs: preflight
    if: needs.preflight.outputs.can_deploy == 'true'
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      REPO_REF: ${{ inputs.REPO_REF || github.ref }}
      AWS_ENV: ${{ inputs.AWS_ENV || 'DEV' }}

  set-version:
    name: ${{ inputs.AWS_ENV || 'DEV' }}
    needs: publish
    uses: provenant-dev/github-action-helper/.github/workflows/set-version.yml@main
    secrets: inherit
    with:
      DEPLOY_ENV: ${{ inputs.AWS_ENV || 'DEV' }}
      RELEASE_VERSION: ${{ needs.publish.outputs.RELEASE_VERSION }}
      SVC_NAME: "cesr_verifier"

  deploy:
    name: ${{ inputs.AWS_ENV || 'DEV' }}
    needs: set-version
    uses: provenant-dev/github-action-helper/.github/workflows/initiate-deployment.yml@main
    secrets: inherit
    with:
      DEPLOY_ENV: ${{ inputs.AWS_ENV || 'DEV' }}
